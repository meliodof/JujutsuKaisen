<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/login_style.css">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-icon"><i class="bi bi-truck"></i></div>
        <div class="login-title">Транспортная система</div>
        <div class="login-subtitle">Войдите в аккаунт</div>

        <div class="mb-3">
            <label class="form-label">Логин</label>
            <input type="text" id="username" class="form-control" placeholder="Введите логин">
        </div>

        <div class="mb-3">
            <label class="form-label">Пароль</label>
            <div class="input-group">
                <input type="password" id="password" class="form-control" placeholder="Введите пароль">
                <button class="btn" type="button" onclick="togglePassword()"><i class="bi bi-eye"></i></button>
            </div>
        </div>

        <div id="error" class="alert alert-danger d-none"></div>
        <button onclick="login()" class="btn-login">Войти</button>
    </div>
    <div class="footer-text">Транспортная система &copy; 2026</div>
</div>
<script src="/js/login/login.js"></script>
</body>
</html>
