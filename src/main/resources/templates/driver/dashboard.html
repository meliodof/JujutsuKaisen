<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Кабинет водителя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/driver_style.css">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <span class="navbar-brand">Кабинет водителя</span>
        <div class="nav-links">
            <a href="/login" class="btn-logout">Выход</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row mb-3">
        <div class="col-md-4">
            <div class="card text-center">
                <div style="font-size: 28px; font-weight: 700;" id="todayCount">0</div>
                <div style="color: #64748b; font-size: 13px;">Рейсов сегодня</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div style="font-size: 28px; font-weight: 700; color: #16a34a;" id="completedCount">0</div>
                <div style="color: #64748b; font-size: 13px;">Завершено</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div style="font-size: 28px; font-weight: 700; color: #f59e0b;" id="inProgressCount">0</div>
                <div style="color: #64748b; font-size: 13px;">В пути</div>
            </div>
        </div>
    </div>

    <h3>Расписание на сегодня</h3>
    <table class="table">
        <thead>
        <tr><th>№</th><th>Маршрут</th><th>Время</th><th>Машина</th><th>Статус</th><th>Действие</th></tr>
        </thead>
        <tbody id="scheduleTable"></tbody>
    </table>
</div>

<footer class="footer">
    Транспортная система &copy; 2026 &nbsp;|&nbsp; Кабинет водителя &nbsp;|&nbsp; Версия 1.0 |&nbsp; Разработчик: компания "JujutsuKaisen"
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/driver/driver.js"></script>
</body>
</html>
