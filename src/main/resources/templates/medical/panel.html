<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Медосмотры</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <span class="navbar-brand">Кабинет медика</span>
        <div class="nav-links">
            <a href="/login" class="btn-logout">Выход</a>
        </div>
    </div>
</nav>

<div class="container">
    <h3>🩺 Медосмотр водителя</h3>
    <div class="card p-4">
        <select id="medDriver" class="form-select mb-3"></select>
        <select id="medType" class="form-select mb-3">
            <option value="pre_trip">Предрейсовый</option>
            <option value="post_trip">Послерейсовый</option>
        </select>
        <select id="medResult" class="form-select mb-3">
            <option value="passed">Допущен</option>
            <option value="failed">Не допущен</option>
        </select>
        <input type="text" id="medNotes" class="form-control mb-3" placeholder="Примечания">
        <button class="btn btn-success w-100" onclick="submitMedical()">Сохранить</button>
    </div>

    <hr>
    <h5>История осмотров</h5>
    <table class="table">
        <thead><tr><th>Водитель</th><th>Тип</th><th>Результат</th><th>Дата</th></tr></thead>
        <tbody id="medHistory"></tbody>
    </table>
</div>

<footer class="footer">Транспортная система &copy; 2026</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/medical/medical.js"></script>
</body>
</html>
