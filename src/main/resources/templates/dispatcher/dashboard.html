<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Дашборд диспетчера</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/css/dispatcher_style.css">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="/dispatcher/panel" class="navbar-brand">Панель диспетчера</a>
        <div class="nav-links">
            <a href="/dispatcher/panel" class="nav-link">Рейсы</a>
            <a href="/dispatcher/dashboard" class="nav-link active">Дашборд</a>
            <a href="/dispatcher/dispatch" class="nav-link">Контроль выезда</a>
            <a href="/login" class="btn-logout">Выход</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row mb-3">
        <div class="col-md-3"><div class="card p-3 text-center stat-card"><h4 id="todayTrips">0</h4><small>Рейсов сегодня</small></div></div>
        <div class="col-md-3"><div class="card p-3 text-center stat-card"><h4 id="waybillsReady">0</h4><small>Путевых листов готово</small></div></div>
        <div class="col-md-3"><div class="card p-3 text-center stat-card"><h4 id="waybillsPending">0</h4><small>Ожидают допуска</small></div></div>
        <div class="col-md-3"><div class="card p-3 text-center stat-card"><h4 id="availableDrivers">0</h4><small>Свободных водителей</small></div></div>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3"><div class="card p-3"><h5>Рейсы за 7 дней</h5><canvas id="tripsChart"></canvas></div></div>
        <div class="col-md-6 mb-3"><div class="card p-3"><h5>Статусы рейсов (сегодня)</h5><canvas id="statusChart"></canvas></div></div>
    </div>

    <div class="row">
        <div class="col-md-12 mb-3"><div class="card p-3"><h5>Путевые листы: готовность к выезду</h5><canvas id="waybillChart"></canvas></div></div>
    </div>
</div>

<footer class="footer">Транспортная система &copy; 2026 | Панель диспетчера</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/dispatcher/dispatcher_notifications.js"></script>
<script src="/js/dispatcher/dispatcher_dashboard.js"></script>
</body>
</html>
