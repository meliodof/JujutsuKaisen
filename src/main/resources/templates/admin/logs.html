<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Логи операций</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="/admin/vehicles" class="navbar-brand">Панель администратора</a>
        <div class="nav-links">
            <a href="/admin/vehicles" class="nav-link">Машины</a>
            <a href="/admin/drivers" class="nav-link">Водители</a>
            <a href="/admin/routes" class="nav-link">Маршруты</a>
            <a href="/admin/schedules" class="nav-link">Расписание</a>
            <a href="/admin/stops" class="nav-link">Остановки</a>
            <a href="/admin/dashboard" class="nav-link">Дашборд</a>
            <a href="/admin/dispatch" class="nav-link">Выезд</a>
            <a href="/admin/users" class="nav-link">Пользователи</a>
            <a href="/admin/logs" class="nav-link active">Логи</a>
            <a href="/login" class="btn-logout">Выход</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row mb-3">
        <div class="col-md-6">
            <input type="text" id="searchInput" class="form-control" placeholder="Поиск..." oninput="filterLogs()">
        </div>
        <div class="col-md-3">
            <select id="typeFilter" class="form-select" onchange="filterLogs()">
                <option value="all">Все операции</option>
                <option value="CREATE">Создание</option>
                <option value="UPDATE">Обновление</option>
                <option value="DELETE">Удаление</option>
                <option value="LOGIN">Вход</option>
                <option value="LOGIN_FAILED">Ошибка входа</option>
            </select>
        </div>
        <div class="col-md-3">
            <button class="btn btn-info w-100" onclick="loadLogs()">Обновить</button>
        </div>
    </div>
    <div id="tablesContainer"></div>
</div>

<footer class="footer">Транспортная система &copy; 2026</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/logs/admin_logs.js"></script>
</body>
</html>
